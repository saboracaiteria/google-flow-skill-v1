<!doctype html>
<html lang="pt-BR" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Cena</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js" } }
    </script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #raiz { position: relative; width: 100%; height: 100%; overflow: hidden; }
      #palco { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <!-- escrito pelo montar.py: a duração vem do tempo da voz -->
    <div id="raiz" data-composition-id="main" data-start="0" data-duration="@@DURACAO@@" data-width="1080" data-height="1920">
      <canvas id="palco" class="clip" data-start="0" data-duration="@@DURACAO@@" data-track-index="0"></canvas>
@@AUDIO@@
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set({}, {}, @@DURACAO@@);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
    <script type="module">
      import { criarCena } from "./js/cena.js";
      let cena = null, ultimo = window.__hfThreeTime || 0;
      async function montar() {
        await document.fonts.ready;
        cena = criarCena(document.getElementById("palco"), document.getElementById("raiz"));
        cena.quadro(window.__hfThreeTime ?? ultimo);
      }
      window.__hf = window.__hf || {};
      window.__hf.buildReady = window.__hf.buildReady || {};
      window.__hf.buildReady["cena"] = montar();
      window.addEventListener("hf-seek", (e) => { ultimo = e.detail.time; if (cena) cena.quadro(ultimo); });
    </script>
  </body>
</html>
